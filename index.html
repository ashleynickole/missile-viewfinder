<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>Missile Studios Live Viewfinder Slideshow</title>

  <style>
    :root {
      --frame: rgba(255,255,255,.92);
      --frame-muted: rgba(255,255,255,.52);
      --bg: #080808;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    .camera-section {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      background: #080808;
      perspective: 1400px;
      isolation: isolate;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y pinch-zoom;
    }

    .image-stage {
      position: absolute;
      inset: -12%;
      transform-style: preserve-3d;
      will-change: transform, filter;
      transition: filter 160ms ease;
    }

    .camera-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.08);
      opacity: 0;
      z-index: 1;
      transition:
        opacity 360ms cubic-bezier(.22,1,.36,1),
        filter 240ms ease;
      filter:
        contrast(1.035)
        saturate(.97)
        brightness(.985)
        blur(0px);
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .camera-image.active {
      opacity: 1;
      z-index: 3;
    }

    .camera-image.outgoing {
      opacity: 1;
      z-index: 2;
    }

    .camera-image.focus-pulse {
      animation: focusPulse 560ms cubic-bezier(.2,.8,.2,1);
    }

    @keyframes focusPulse {
      0% {
        filter:
          contrast(1.035)
          saturate(.97)
          brightness(.985)
          blur(0px);
      }
      30% {
        filter:
          contrast(1.01)
          saturate(.94)
          brightness(.99)
          blur(3.2px);
      }
      58% {
        filter:
          contrast(1.05)
          saturate(.98)
          brightness(1.01)
          blur(.7px);
      }
      100% {
        filter:
          contrast(1.035)
          saturate(.97)
          brightness(.985)
          blur(0px);
      }
    }

    .image-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(0,0,0,.07) 66%,
          rgba(0,0,0,.34) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.04),
          transparent 20%,
          transparent 80%,
          rgba(0,0,0,.11)
        );
    }

    .glass {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          118deg,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,0) 29%,
          rgba(255,255,255,0) 72%,
          rgba(255,255,255,.035) 100%
        );
    }

    .viewfinder {
      position: absolute;
      inset: clamp(18px, 3vw, 50px);
      z-index: 5;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: clamp(38px, 5vw, 78px);
      height: clamp(38px, 5vw, 78px);
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--focus-color, var(--frame));
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(0,0,0,.22);
    }

    .corner::before {
      width: 100%;
      height: 2px;
    }

    .corner::after {
      width: 2px;
      height: 100%;
    }

    .tl { top: 0; left: 0; }
    .tl::before, .tl::after { top: 0; left: 0; }

    .tr { top: 0; right: 0; }
    .tr::before { top: 0; right: 0; }
    .tr::after { top: 0; right: 0; }

    .bl { bottom: 0; left: 0; }
    .bl::before { bottom: 0; left: 0; }
    .bl::after { bottom: 0; left: 0; }

    .br { bottom: 0; right: 0; }
    .br::before { bottom: 0; right: 0; }
    .br::after { bottom: 0; right: 0; }

    .focus-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(76px, 9vw, 132px);
      aspect-ratio: 1.4;
      transform: translate(-50%, -50%);
      opacity: .74;
      transition:
        left 180ms cubic-bezier(.22,1,.36,1),
        top 180ms cubic-bezier(.22,1,.36,1),
        opacity 160ms ease,
        filter 160ms ease;
    }

    .focus-corner {
      position: absolute;
      width: 20%;
      height: 27%;
    }

    .focus-corner::before,
    .focus-corner::after {
      content: "";
      position: absolute;
      background: var(--focus-color, var(--frame));
      border-radius: 999px;
      box-shadow: 0 0 8px color-mix(in srgb, var(--focus-color, white) 55%, transparent);
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .focus-corner::before {
      width: 100%;
      height: 1.5px;
    }

    .focus-corner::after {
      width: 1.5px;
      height: 100%;
    }

    .focus-corner.tl::before,
    .focus-corner.tl::after { top: 0; left: 0; }

    .focus-corner.tr::before { top: 0; right: 0; }
    .focus-corner.tr::after { top: 0; right: 0; }

    .focus-corner.bl::before { bottom: 0; left: 0; }
    .focus-corner.bl::after { bottom: 0; left: 0; }

    .focus-corner.br::before { bottom: 0; right: 0; }
    .focus-corner.br::after { bottom: 0; right: 0; }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--focus-color, var(--frame));
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px color-mix(in srgb, var(--focus-color, white) 55%, transparent);
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .safe-line {
      position: absolute;
      left: 50%;
      width: 42px;
      height: 1px;
      transform: translateX(-50%);
      background: var(--frame-muted);
    }

    .safe-line.top { top: 0; }
    .safe-line.bottom { bottom: 0; }

    .side-mark {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 38px;
      transform: translateY(-50%);
      background: var(--frame-muted);
    }

    .side-mark.left { left: 0; }
    .side-mark.right { right: 0; }

    .grain {
      position: absolute;
      inset: -40%;
      z-index: 6;
      pointer-events: none;
      opacity: .045;
      background-image:
        repeating-radial-gradient(
          circle at 18% 31%,
          rgba(255,255,255,.7) 0 .45px,
          rgba(0,0,0,.6) .7px 1px,
          transparent 1.2px 4px
        );
      background-size: 6px 6px;
      animation: grain .24s steps(2) infinite;
      mix-blend-mode: overlay;
    }

    @keyframes grain {
      0% { transform: translate3d(-2%,1%,0); }
      25% { transform: translate3d(1%,-2%,0); }
      50% { transform: translate3d(2%,2%,0); }
      75% { transform: translate3d(-1%,-1%,0); }
      100% { transform: translate3d(1%,1%,0); }
    }



    .shutter-flash {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: rgba(255,255,255,.98);
      opacity: 0;
    }

    .shutter-flash.fire {
      animation: shutterFlash 260ms ease-out;
    }

    @keyframes shutterFlash {
      0% { opacity: 0; }
      10% { opacity: .88; }
      22% { opacity: .34; }
      100% { opacity: 0; }
    }

    .camera-section.shutter-kick .image-stage {
      animation: shutterKick 250ms cubic-bezier(.2,.8,.2,1);
    }

    @keyframes shutterKick {
      0% { filter: brightness(1); }
      12% { filter: brightness(1.12); }
      36% { filter: brightness(.97); }
      100% { filter: brightness(1); }
    }

    .camera-section.capture-zoom .image-stage {
      animation: captureZoom 640ms cubic-bezier(.18,.82,.22,1);
    }

    @keyframes captureZoom {
      0% { scale: 1; }
      22% { scale: 1.075; }
      48% { scale: 1.025; }
      72% { scale: 1.055; }
      100% { scale: 1; }
    }

    .camera-section.photo-swap .image-stage {
      animation: photoSwapMotion 420ms cubic-bezier(.2,.75,.2,1);
    }

    @keyframes photoSwapMotion {
      0% { translate: 0 0; rotate: 0deg; }
      28% { translate: -18px 7px; rotate: -.55deg; }
      58% { translate: 13px -5px; rotate: .38deg; }
      100% { translate: 0 0; rotate: 0deg; }
    }



    .zoom-readout {
      position: absolute;
      right: clamp(20px, 3vw, 48px);
      bottom: clamp(18px, 3vw, 42px);
      z-index: 8;
      color: rgba(255,255,255,.88);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .camera-section.pinching .zoom-readout {
      opacity: 1;
      transform: translateY(0);
    }

    .focus-box.searching {
      --focus-color: #ffd43b;
      opacity: 1;
      animation: focusSearch 360ms ease-in-out;
    }

    .focus-box.locked {
      --focus-color: #39ff6a;
      opacity: 1;
      animation: focusLock 360ms cubic-bezier(.2,.8,.2,1);
      filter: drop-shadow(0 0 8px rgba(57,255,106,.38));
    }

    @keyframes focusSearch {
      0% { transform: translate(-50%, -50%) scale(1.12); opacity: .35; }
      35% { transform: translate(-50%, -50%) scale(.92); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.04); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes focusLock {
      0% { transform: translate(-50%, -50%) scale(.90); }
      45% { transform: translate(-50%, -50%) scale(1.10); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .shutter-flash.user-fire {
      animation: userFlash 340ms ease-out;
    }

    @keyframes userFlash {
      0% { opacity: 0; }
      8% { opacity: 1; }
      18% { opacity: .72; }
      34% { opacity: .22; }
      100% { opacity: 0; }
    }

    .camera-section.user-trigger .image-stage {
      animation: userTriggerShake 360ms cubic-bezier(.18,.82,.2,1);
    }

    @keyframes userTriggerShake {
      0%   { translate: 0 0; rotate: 0deg; scale: 1; }
      12%  { translate: -5px 4px; rotate: -.34deg; scale: 1.012; }
      26%  { translate: 7px -5px; rotate: .42deg; scale: 1.025; }
      44%  { translate: -4px 3px; rotate: -.24deg; scale: 1.015; }
      68%  { translate: 2px -1px; rotate: .10deg; scale: 1.006; }
      100% { translate: 0 0; rotate: 0deg; scale: 1; }
    }


    .camera-section.metering .image-stage {
      animation: exposureMeter 520ms ease-in-out;
    }

    @keyframes exposureMeter {
      0% { filter: brightness(1); }
      24% { filter: brightness(1.08); }
      48% { filter: brightness(.94); }
      72% { filter: brightness(1.035); }
      100% { filter: brightness(1); }
    }

    .focus-box.hunting {
      animation: focusHunt 520ms cubic-bezier(.2,.8,.2,1);
    }

    @keyframes focusHunt {
      0% { transform: translate(-50%, -50%) scale(1.18); opacity: .35; }
      28% { transform: translate(-50%, -50%) scale(.88); opacity: .96; }
      56% { transform: translate(-50%, -50%) scale(1.08); }
      78% { transform: translate(-50%, -50%) scale(.96); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .camera-section.resetting .image-stage {
      transition: transform 420ms cubic-bezier(.22,1,.36,1);
    }

    .camera-section.dragging {
      cursor: grabbing;
    }

    .camera-section.zoomed .zoom-readout {
      opacity: .78;
      transform: translateY(0);
    }

    .camera-section .zoom-readout::after {
      content: "  DRAG TO MOVE";
      margin-left: 8px;
      opacity: .68;
      font-weight: 600;
    }
      22% { opacity: .95; transform: translateY(0); }
      72% { opacity: .72; }
      100% { opacity: .72; }
    }

    .move-hint {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 3vw, 42px);
      z-index: 8;
      transform: translateX(-50%) translateY(5px);
      color: rgba(255,255,255,.78);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      opacity: 0;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
    }

    .camera-section.dragging .move-hint {
      opacity: .8;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 700px) {
      .camera-section {
        min-height: 420px;
      }

      .viewfinder {
        inset: 15px;
      }

      .image-stage {
        inset: -16%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .image-stage {
        transform: none !important;
      }

      .grain {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <section class="camera-section" id="cameraSection">
    <div class="image-stage" id="imageStage">
      <img
        class="camera-image active"
        src="https://static.wixstatic.com/media/566b6b_83e7b2d53f6a47f1999d518594826438~mv2.jpg"
        alt="Missile Studios client portrait one"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_49f246107046486e80eba06518aba4bd~mv2.png"
        alt="Missile Studios client portrait two"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_2b2a14b7ccf546bfae5b7f922ad07433~mv2.jpg"
        alt="Missile Studios client portrait three"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_03552c2680ff4944aeea31f9e3b3a21d~mv2.jpg"
        alt="Missile Studios client portrait four"
        draggable="false"
        decoding="async"
        loading="eager"
      />
      <img
        class="camera-image"
        src="https://static.wixstatic.com/media/566b6b_905f73eb0b704f40bd8a210a8b627946~mv2.jpg"
        alt="Missile Studios client portrait five"
        draggable="false"
        decoding="async"
        loading="eager"
      />
    </div>

    <div class="glass"></div>

    <div class="viewfinder" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <span class="safe-line top"></span>
      <span class="safe-line bottom"></span>
      <span class="side-mark left"></span>
      <span class="side-mark right"></span>

      <div class="focus-box" id="focusBox">
        <span class="focus-corner tl"></span>
        <span class="focus-corner tr"></span>
        <span class="focus-corner bl"></span>
        <span class="focus-corner br"></span>
        <span class="center-dot"></span>
      </div>
    </div>

    <div class="grain"></div>
    <div class="move-hint" aria-hidden="true">DRAG TO REFRAME</div>
    <div class="zoom-readout" id="zoomReadout" aria-live="polite">1.0×</div>
    <div class="shutter-flash" id="shutterFlash"></div>
  </section>


  <script>
    (() => {
      const imageStage = document.getElementById("imageStage");
      const cameraSection = document.getElementById("cameraSection");
      const shutterFlash = document.getElementById("shutterFlash");
      const focusBox = document.getElementById("focusBox");
      const zoomReadout = document.getElementById("zoomReadout");
      const viewfinder = document.querySelector(".viewfinder");
      const images = [...document.querySelectorAll(".camera-image")];

      let activeImageIndex = 0;
      let imageCycleTimer = null;

      let pointerTargetX = 0;
      let pointerTargetY = 0;
      let pointerX = 0;
      let pointerY = 0;

      let userZoomTarget = 1;
      let userZoom = 1;
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;
      let pinchActive = false;
      let touchMoved = false;
      let touchStartX = 0;
      let touchStartY = 0;

      let userPanXTarget = 0;
      let userPanYTarget = 0;
      let userPanX = 0;
      let userPanY = 0;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragOriginX = 0;
      let dragOriginY = 0;
      let dragging = false;

      let lastTapTime = 0;
      let lastTapX = 0;
      let lastTapY = 0;

      let audioContext = null;
      let audioReady = false;

      let currentX = 0;
      let currentY = 0;
      let currentScale = 1.16;
      let currentRotate = 0;

      let lastTime = performance.now();
      let elapsed = 0;

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function updatePointer(clientX, clientY) {
        const rect = cameraSection.getBoundingClientRect();

        pointerTargetX = clamp(
          ((clientX - rect.left) / rect.width - .5) * 2,
          -1,
          1
        );

        pointerTargetY = clamp(
          ((clientY - rect.top) / rect.height - .5) * 2,
          -1,
          1
        );
      }

      cameraSection.addEventListener("pointermove", event => {
        updatePointer(event.clientX, event.clientY);
      });

      cameraSection.addEventListener("pointerleave", () => {
        pointerTargetX = 0;
        pointerTargetY = 0;
      });

      function touchDistance(touchA, touchB) {
        const dx = touchB.clientX - touchA.clientX;
        const dy = touchB.clientY - touchA.clientY;
        return Math.hypot(dx, dy);
      }

      cameraSection.addEventListener("touchstart", event => {
        if (event.touches.length === 2) {
          pinchActive = true;
          touchMoved = true;
          pinchStartDistance = touchDistance(
            event.touches[0],
            event.touches[1]
          );
          pinchStartZoom = userZoomTarget;
          return;
        }

        if (event.touches.length === 1) {
          ensureAudio();
          pinchActive = false;
          touchMoved = false;
          touchStartX = event.touches[0].clientX;
          touchStartY = event.touches[0].clientY;

          dragging = true;
          dragStartX = event.touches[0].clientX;
          dragStartY = event.touches[0].clientY;
          dragOriginX = userPanXTarget;
          dragOriginY = userPanYTarget;
        }
      }, { passive: true });

      cameraSection.addEventListener("touchmove", event => {
        if (event.touches.length === 2 && pinchStartDistance > 0) {
          event.preventDefault();

          pinchActive = true;
          touchMoved = true;

          const distance = touchDistance(
            event.touches[0],
            event.touches[1]
          );

          const ratio = distance / pinchStartDistance;

          userZoomTarget = clamp(
            pinchStartZoom * ratio,
            1,
            2.45
          );

          zoomReadout.textContent = `${userZoomTarget.toFixed(1)}×`;
          cameraSection.classList.add("pinching");

          if (userZoomTarget > 1.01) {
            cameraSection.classList.add("zoomed");
          } else {
            cameraSection.classList.remove("zoomed");
          }

          const midpointX =
            (event.touches[0].clientX + event.touches[1].clientX) / 2;

          const midpointY =
            (event.touches[0].clientY + event.touches[1].clientY) / 2;

          updatePointer(midpointX, midpointY);
          return;
        }

        if (event.touches.length === 1) {
          const touch = event.touches[0];
          const movement = Math.hypot(
            touch.clientX - touchStartX,
            touch.clientY - touchStartY
          );

          if (movement > 10) {
            touchMoved = true;
          }

          if (dragging && movement > 8) {
            event.preventDefault();
            cameraSection.classList.add("dragging");

            // Permit a useful amount of movement even at 1×,
            // then expand the range naturally as the user zooms in.
            const maxPanX = 72 + 150 * (userZoomTarget - 1);
            const maxPanY = 58 + 125 * (userZoomTarget - 1);

            userPanXTarget = clamp(
              dragOriginX + (touch.clientX - dragStartX),
              -maxPanX,
              maxPanX
            );

            userPanYTarget = clamp(
              dragOriginY + (touch.clientY - dragStartY),
              -maxPanY,
              maxPanY
            );
          }
        }
      }, { passive: false });

      cameraSection.addEventListener("touchend", event => {
        if (pinchActive) {
          if (event.touches.length < 2) {
            pinchActive = false;
            pinchStartDistance = 0;
            cameraSection.classList.remove("pinching");
            pointerTargetX = 0;
            pointerTargetY = 0;
          }
          return;
        }

        if (event.touches.length === 0) {
          const changedTouch = event.changedTouches[0];

          cameraSection.classList.remove("dragging");
          dragging = false;

          if (!touchMoved && changedTouch) {
            if (registerTap(changedTouch.clientX, changedTouch.clientY)) {
              pointerTargetX = 0;
              pointerTargetY = 0;
              return;
            }

            window.setTimeout(() => {
              const elapsedSinceTap = performance.now() - lastTapTime;

              if (elapsedSinceTap >= 280) {
                runUserCapture(
                  changedTouch.clientX,
                  changedTouch.clientY
                );
              }
            }, 300);
          }

          pointerTargetX = 0;
          pointerTargetY = 0;
        }
      }, { passive: true });


      const imageReady = images.map(image => {
        if (image.complete && image.naturalWidth > 0) {
          return Promise.resolve();
        }

        return new Promise(resolve => {
          image.addEventListener("load", resolve, { once: true });
          image.addEventListener("error", resolve, { once: true });
        });
      });

      function restartClass(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
      }

      function fireShutter() {
        if (audioReady) {
          playShutterSound();
        }

        restartClass(shutterFlash, "fire");
        restartClass(cameraSection, "shutter-kick");

        window.setTimeout(() => {
          shutterFlash.classList.remove("fire");
          cameraSection.classList.remove("shutter-kick");
        }, 280);
      }

      function focusCurrentImage() {
        const current = images[activeImageIndex];
        restartClass(current, "focus-pulse");

        window.setTimeout(() => {
          current.classList.remove("focus-pulse");
        }, 600);
      }

      async function showNextImage() {
        const oldIndex = activeImageIndex;
        const nextIndex = (activeImageIndex + 1) % images.length;

        await imageReady[nextIndex];

        const outgoing = images[oldIndex];
        const incoming = images[nextIndex];

        incoming.classList.add("active");
        outgoing.classList.add("outgoing");

        restartClass(cameraSection, "photo-swap");

        // Incoming image becomes visible before outgoing image fades.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            outgoing.classList.remove("active");
            outgoing.classList.remove("outgoing");
            activeImageIndex = nextIndex;
          });
        });

        window.setTimeout(() => {
          cameraSection.classList.remove("photo-swap");
        }, 460);
      }

      async function runImageCycle() {
        clearTimeout(imageCycleTimer);

        // Keep the idle viewfinder alive, but only take a photo when tapped.
        imageCycleTimer = window.setTimeout(async () => {
          await showNextImage();
          imageCycleTimer = window.setTimeout(runImageCycle, 2600);
        }, 2600);
      }



      async function ensureAudio() {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return false;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          try {
            await audioContext.resume();
          } catch (error) {
            return false;
          }
        }

        // Play an almost-silent buffer to force iOS/Safari audio activation.
        const buffer = audioContext.createBuffer(1, 1, 22050);
        const source = audioContext.createBufferSource();
        const gain = audioContext.createGain();

        gain.gain.value = 0.00001;
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(audioContext.destination);
        source.start();

        audioReady = audioContext.state === "running";

        return audioReady;
      }

      function playTone({
        frequency = 900,
        duration = .08,
        volume = .09,
        type = "sine",
        delay = 0
      } = {}) {
        if (!audioReady || !audioContext) return;

        const start = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);

        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .006);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(start);
        oscillator.stop(start + duration + .03);
      }

      function playNoiseBurst({
        duration = .07,
        volume = .14,
        delay = 0,
        highpass = 700
      } = {}) {
        if (!audioReady || !audioContext) return;

        const sampleRate = audioContext.sampleRate;
        const frameCount = Math.max(1, Math.floor(sampleRate * duration));
        const buffer = audioContext.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < frameCount; i++) {
          const decay = 1 - i / frameCount;
          data[i] = (Math.random() * 2 - 1) * decay;
        }

        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        const start = audioContext.currentTime + delay;

        source.buffer = buffer;
        filter.type = "highpass";
        filter.frequency.setValueAtTime(highpass, start);

        gain.gain.setValueAtTime(volume, start);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        source.start(start);
      }

      function playFocusSound() {
        // Short Nikon-style AF confirmation chirp.
        playTone({
          frequency: 1480,
          duration: .052,
          volume: .085,
          type: "sine"
        });

        playTone({
          frequency: 1760,
          duration: .032,
          volume: .045,
          type: "sine",
          delay: .038
        });
      }

      function playShutterSound() {
        // Layered mechanical sequence tuned to feel closer to a Nikon Z6II.
        playNoiseBurst({
          duration: .022,
          volume: .18,
          delay: 0,
          highpass: 1900
        });

        playTone({
          frequency: 118,
          duration: .045,
          volume: .11,
          type: "square",
          delay: .004
        });

        playNoiseBurst({
          duration: .042,
          volume: .24,
          delay: .028,
          highpass: 980
        });

        playTone({
          frequency: 76,
          duration: .075,
          volume: .12,
          type: "triangle",
          delay: .036
        });

        playNoiseBurst({
          duration: .032,
          volume: .13,
          delay: .082,
          highpass: 1500
        });
      }


      const unlockAudioFromGesture = async () => {
        await ensureAudio();
      };

      cameraSection.addEventListener("pointerdown", unlockAudioFromGesture, {
        passive: true
      });

      cameraSection.addEventListener("touchstart", unlockAudioFromGesture, {
        passive: true
      });

      let userCaptureBusy = false;

      function placeFocusPoint(clientX, clientY) {
        const rect = viewfinder.getBoundingClientRect();

        const x = clamp(clientX - rect.left, 22, rect.width - 22);
        const y = clamp(clientY - rect.top, 22, rect.height - 22);

        focusBox.style.left = `${x}px`;
        focusBox.style.top = `${y}px`;
      }

      function userShutterFlash() {
        shutterFlash.classList.remove("fire", "user-fire");
        cameraSection.classList.remove("user-trigger");

        void shutterFlash.offsetWidth;

        shutterFlash.classList.add("user-fire");
        cameraSection.classList.add("user-trigger");

        window.setTimeout(() => {
          shutterFlash.classList.remove("user-fire");
          cameraSection.classList.remove("user-trigger");
        }, 390);
      }

      function runUserCapture(clientX, clientY) {
        if (userCaptureBusy || pinchActive || dragging) return;
        userCaptureBusy = true;

        ensureAudio();
        placeFocusPoint(clientX, clientY);

        focusBox.classList.remove("locked", "searching", "hunting");
        focusBox.classList.add("hunting");
        cameraSection.classList.add("metering");
        focusCurrentImage();

        window.setTimeout(() => {
          focusBox.classList.remove("hunting");
          focusBox.classList.add("searching");
        }, 260);

        window.setTimeout(() => {
          focusBox.classList.remove("searching");
          focusBox.classList.add("locked");
          playFocusSound();

          window.setTimeout(() => {
            playShutterSound();
            userShutterFlash();

            window.setTimeout(() => {
              focusBox.classList.remove("locked");
              cameraSection.classList.remove("metering");
              userCaptureBusy = false;
            }, 620);
          }, 110);
        }, 430);
      }

      function resetZoomAndPan() {
        cameraSection.classList.add("resetting");

        userZoomTarget = 1;
        userPanXTarget = 0;
        userPanYTarget = 0;
        zoomReadout.textContent = "1.0×";
        cameraSection.classList.remove("zoomed", "pinching", "dragging");

        window.setTimeout(() => {
          cameraSection.classList.remove("resetting");
        }, 460);
      }

      function registerTap(clientX, clientY) {
        const now = performance.now();
        const distance = Math.hypot(
          clientX - lastTapX,
          clientY - lastTapY
        );

        const isDoubleTap =
          now - lastTapTime < 320 &&
          distance < 42;

        lastTapTime = now;
        lastTapX = clientX;
        lastTapY = clientY;

        if (isDoubleTap) {
          resetZoomAndPan();
          return true;
        }

        return false;
      }

      cameraSection.addEventListener("pointerup", event => {
        if (event.pointerType !== "mouse" || event.button !== 0) return;

        ensureAudio();

        if (registerTap(event.clientX, event.clientY)) {
          return;
        }

        window.setTimeout(() => {
          const elapsedSinceTap = performance.now() - lastTapTime;

          if (elapsedSinceTap >= 280) {
            runUserCapture(event.clientX, event.clientY);
          }
        }, 300);
      });

      function animate(now) {
        const delta = Math.min(.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += delta;

        if (reducedMotion) {
          imageStage.style.transform =
            "translate3d(0,0,0) scale(1.16)";
          requestAnimationFrame(animate);
          return;
        }

        pointerX += (pointerTargetX - pointerX) * .055;
        pointerY += (pointerTargetY - pointerY) * .055;
        userZoom += (userZoomTarget - userZoom) * .12;
        userPanX += (userPanXTarget - userPanX) * .14;
        userPanY += (userPanYTarget - userPanY) * .14;

        /*
          Live viewfinder drift:
          Layered waves keep it moving without looking like
          a cheap repeating shake.
        */
        const liveX =
          Math.sin(elapsed * .53) * 10 +
          Math.sin(elapsed * 1.17 + 1.4) * 4;

        const liveY =
          Math.cos(elapsed * .46 + .6) * 8 +
          Math.sin(elapsed * 1.03) * 3;

        const liveZoom =
          Math.sin(elapsed * .46) * .026 +
          Math.sin(elapsed * 1.08 + .9) * .012;

        const zoomPanStrength = Math.max(0, userZoom - 1);

        const targetX =
          userPanX +
          pointerX * (-22 - zoomPanStrength * 26) +
          liveX;

        const targetY =
          userPanY +
          pointerY * (-16 - zoomPanStrength * 22) +
          liveY;

        const targetScale =
          (1.16 + liveZoom) * userZoom +
          Math.abs(pointerX) * .01 +
          Math.abs(pointerY) * .008;

        const targetRotate =
          pointerX * 1.5 +
          Math.sin(elapsed * .42) * .22;

        currentX += (targetX - currentX) * .065;
        currentY += (targetY - currentY) * .065;
        currentScale += (targetScale - currentScale) * .055;
        currentRotate += (targetRotate - currentRotate) * .05;

        imageStage.style.transform =
          `translate3d(${currentX}px, ${currentY}px, 0)
           rotateZ(${currentRotate}deg)
           scale(${currentScale})`;

        requestAnimationFrame(animate);
      }

      runImageCycle();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
