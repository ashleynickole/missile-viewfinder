<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Missile Studios Live Viewfinder</title>
<style>
:root{--frame:rgba(255,255,255,.92);--muted:rgba(255,255,255,.52);--bg:#080808}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.camera{position:relative;width:100%;height:100svh;min-height:420px;overflow:hidden;background:#080808;isolation:isolate;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
.stage{position:absolute;inset:-16%;transform-style:preserve-3d;will-change:transform,filter}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.08);opacity:0;transition:opacity .36s cubic-bezier(.22,1,.36,1),filter .24s ease;filter:contrast(1.035) saturate(.97) brightness(.985);pointer-events:none;-webkit-user-drag:none}
.photo.active{opacity:1}
.photo.focus{animation:focusPulse .56s cubic-bezier(.2,.8,.2,1)}
@keyframes focusPulse{0%,100%{filter:contrast(1.035) saturate(.97) brightness(.985) blur(0)}30%{filter:contrast(1.01) saturate(.94) brightness(.99) blur(3.2px)}58%{filter:contrast(1.05) saturate(.98) brightness(1.01) blur(.7px)}}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.07) 66%,rgba(0,0,0,.34) 100%),linear-gradient(to bottom,rgba(0,0,0,.04),transparent 20%,transparent 80%,rgba(0,0,0,.11))}
.glass{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.075),transparent 29%,transparent 72%,rgba(255,255,255,.035))}
.viewfinder{position:absolute;inset:clamp(15px,3vw,50px);z-index:5;pointer-events:none}
.corner{position:absolute;width:clamp(38px,5vw,78px);height:clamp(38px,5vw,78px)}
.corner:before,.corner:after,.fc:before,.fc:after{content:"";position:absolute;background:var(--focus,var(--frame));border-radius:999px;box-shadow:0 0 8px rgba(0,0,0,.25)}
.corner:before{width:100%;height:2px}.corner:after{width:2px;height:100%}
.tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}
.tl:before,.tl:after{top:0;left:0}.tr:before{top:0;right:0}.tr:after{top:0;right:0}.bl:before{bottom:0;left:0}.bl:after{bottom:0;left:0}.br:before{bottom:0;right:0}.br:after{bottom:0;right:0}
.safe{position:absolute;background:var(--muted)}.safe.top,.safe.bottom{left:50%;width:42px;height:1px;transform:translateX(-50%)}.safe.top{top:0}.safe.bottom{bottom:0}.safe.left,.safe.right{top:50%;width:1px;height:38px;transform:translateY(-50%)}.safe.left{left:0}.safe.right{right:0}
.focusbox{position:absolute;left:50%;top:50%;width:clamp(76px,9vw,132px);aspect-ratio:1.4;transform:translate(-50%,-50%);opacity:.74;transition:left .18s cubic-bezier(.22,1,.36,1),top .18s cubic-bezier(.22,1,.36,1),opacity .16s ease,filter .16s ease}
.fc{position:absolute;width:20%;height:27%}.fc:before{width:100%;height:1.5px}.fc:after{width:1.5px;height:100%}
.dot{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:var(--focus,var(--frame));transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,255,255,.55)}
.focusbox.hunting{animation:hunt .43s cubic-bezier(.2,.8,.2,1)}.focusbox.searching{--focus:#ffd43b;opacity:1}.focusbox.locked{--focus:#39ff6a;opacity:1;filter:drop-shadow(0 0 8px rgba(57,255,106,.38));animation:lock .3s cubic-bezier(.2,.8,.2,1)}
@keyframes hunt{0%{transform:translate(-50%,-50%) scale(1.18);opacity:.35}45%{transform:translate(-50%,-50%) scale(.88);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes lock{0%{transform:translate(-50%,-50%) scale(.9)}50%{transform:translate(-50%,-50%) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1)}}
.grain{position:absolute;inset:-40%;z-index:6;pointer-events:none;opacity:.045;background-image:repeating-radial-gradient(circle at 18% 31%,rgba(255,255,255,.7) 0 .45px,rgba(0,0,0,.6) .7px 1px,transparent 1.2px 4px);background-size:6px 6px;animation:grain .24s steps(2) infinite;mix-blend-mode:overlay}
@keyframes grain{0%{transform:translate3d(-2%,1%,0)}25%{transform:translate3d(1%,-2%,0)}50%{transform:translate3d(2%,2%,0)}75%{transform:translate3d(-1%,-1%,0)}100%{transform:translate3d(1%,1%,0)}}
.flash{position:absolute;inset:0;z-index:20;pointer-events:none;background:#fff;opacity:0}.flash.fire{animation:flash .34s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}18%{opacity:.72}34%{opacity:.22}100%{opacity:0}}
.camera.shutter .stage{animation:shake .36s cubic-bezier(.18,.82,.2,1)}
@keyframes shake{0%,100%{translate:0 0;rotate:0;scale:1}12%{translate:-5px 4px;rotate:-.34deg;scale:1.012}26%{translate:7px -5px;rotate:.42deg;scale:1.025}44%{translate:-4px 3px;rotate:-.24deg;scale:1.015}68%{translate:2px -1px;rotate:.1deg;scale:1.006}}
.camera.freeze .stage{filter:contrast(1.045) saturate(.98) brightness(.99)}
.readout{position:absolute;right:clamp(20px,3vw,48px);bottom:clamp(18px,3vw,42px);z-index:8;color:rgba(255,255,255,.88);font-size:11px;font-weight:700;letter-spacing:.08em;text-shadow:0 1px 8px #000;opacity:0;transition:.18s;pointer-events:none}.camera.zoomed .readout,.camera.pinching .readout{opacity:.78}.readout:after{content:"  DRAG TO MOVE";margin-left:8px;opacity:.68}
.backdrop{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.16);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility 0s linear .3s}
.backdrop.show{opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.cta{position:absolute;left:50%;top:50%;z-index:30;width:min(88vw,520px);padding:clamp(22px,4vw,34px);transform:translate(-50%,-46%) scale(.94);border:1px solid rgba(255,255,255,.3);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08));box-shadow:0 24px 70px rgba(0,0,0,.34),inset 1px 1px 0 rgba(255,255,255,.48),inset -1px -1px 0 rgba(0,0,0,.12);backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .42s cubic-bezier(.22,1,.36,1),transform .52s cubic-bezier(.22,1,.36,1),visibility 0s linear .52s}
.cta.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1);transition-delay:0s}.cta h2{margin:0 0 18px;color:#fff;font-size:clamp(20px,4.2vw,34px);line-height:1.05;letter-spacing:.12em;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.book{display:inline-flex;width:min(100%,320px);border-radius:999px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.28));animation:float 2.6s ease-in-out infinite}.book img{display:block;width:100%;height:auto;max-height:92px;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.025)}}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.34);border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08));box-shadow:0 10px 24px rgba(0,0,0,.2),inset 1px 1px 0 rgba(255,255,255,.5);color:#fff;font:300 25px/1 Arial;cursor:pointer;z-index:2}
@media(prefers-reduced-motion:reduce){.stage{transform:none!important}.grain,.book{animation:none}}
</style>
</head>
<body>
<section class="camera" id="camera">
  <div class="stage" id="stage">
    <img class="photo active" src="https://static.wixstatic.com/media/566b6b_83e7b2d53f6a47f1999d518594826438~mv2.jpg" alt="" draggable="false">
    <img class="photo" src="https://static.wixstatic.com/media/566b6b_49f246107046486e80eba06518aba4bd~mv2.png" alt="" draggable="false">
    <img class="photo" src="https://static.wixstatic.com/media/566b6b_2b2a14b7ccf546bfae5b7f922ad07433~mv2.jpg" alt="" draggable="false">
    <img class="photo" src="https://static.wixstatic.com/media/566b6b_03552c2680ff4944aeea31f9e3b3a21d~mv2.jpg" alt="" draggable="false">
    <img class="photo" src="https://static.wixstatic.com/media/566b6b_905f73eb0b704f40bd8a210a8b627946~mv2.jpg" alt="" draggable="false">
  </div>
  <div class="glass"></div>
  <div class="viewfinder" id="viewfinder" aria-hidden="true">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <span class="safe top"></span><span class="safe bottom"></span><span class="safe left"></span><span class="safe right"></span>
    <div class="focusbox" id="focusbox"><span class="fc tl"></span><span class="fc tr"></span><span class="fc bl"></span><span class="fc br"></span><span class="dot"></span></div>
  </div>
  <div class="grain"></div>
  <div class="readout" id="readout">1.0×</div>
  <div class="flash" id="flash"></div>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="cta" id="cta" aria-hidden="true">
    <button class="close" id="close" type="button" aria-label="Close booking prompt">&times;</button>
    <h2>READY FOR YOUR CLOSE-UP?</h2>
    <a class="book" href="https://missilephoto.com/book" aria-label="Book your session with Missile Studios">
      <img src="https://static.wixstatic.com/media/566b6b_57e5c5d4bc3643bd913a321c6cf9028b~mv2.png" alt="Book your session" draggable="false">
    </a>
  </div>
</section>
<script>
(()=>{
const camera=document.getElementById("camera"),stage=document.getElementById("stage"),viewfinder=document.getElementById("viewfinder"),focusbox=document.getElementById("focusbox"),flash=document.getElementById("flash"),readout=document.getElementById("readout"),cta=document.getElementById("cta"),backdrop=document.getElementById("backdrop"),close=document.getElementById("close"),photos=[...document.querySelectorAll(".photo")];
let audio=null,audioReady=false,captureBusy=false,captures=0,modalOpen=false,ignoreUntil=0,freezeUntil=0;
let activePointer=null,startX=0,startY=0,lastX=0,lastY=0,moved=false,dragging=false;
let panX=0,panY=0,panTX=0,panTY=0,zoom=1,zoomT=1,pinchStart=0,pinchZoom=1;
let pointers=new Map(),px=0,py=0,ptx=0,pty=0,cx=0,cy=0,cs=1.16,cr=0,last=performance.now(),elapsed=0;
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function blocked(){return modalOpen||performance.now()<ignoreUntil}
async function ensureAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!audio)audio=new AC();if(audio.state==="suspended"){try{await audio.resume()}catch(e){return false}}audioReady=audio.state==="running";return audioReady}
function tone(f,d=.06,v=.08,type="sine",delay=0){if(!audioReady||!audio)return;const s=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.006);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(audio.destination);o.start(s);o.stop(s+d+.03)}
function noise(d=.04,v=.15,delay=0,hp=900){if(!audioReady||!audio)return;const n=Math.floor(audio.sampleRate*d),b=audio.createBuffer(1,n,audio.sampleRate),data=b.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain(),t=audio.currentTime+delay;s.buffer=b;f.type="highpass";f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(audio.destination);s.start(t)}
function focusSound(){tone(1480,.052,.085);tone(1760,.032,.045,"sine",.038)}
function shutterSound(){noise(.022,.18,0,1900);tone(118,.045,.11,"square",.004);noise(.042,.24,.028,980);tone(76,.075,.12,"triangle",.036);noise(.032,.13,.082,1500)}
function place(x,y){const r=viewfinder.getBoundingClientRect();focusbox.style.left=clamp(x-r.left,22,r.width-22)+"px";focusbox.style.top=clamp(y-r.top,22,r.height-22)+"px"}
function showCta(){modalOpen=true;ignoreUntil=performance.now()+700;cta.classList.add("show");backdrop.classList.add("show");cta.setAttribute("aria-hidden","false");backdrop.setAttribute("aria-hidden","false")}
function hideCta(e){if(e){e.preventDefault();e.stopPropagation()}modalOpen=false;ignoreUntil=performance.now()+700;cta.classList.remove("show");backdrop.classList.remove("show");cta.setAttribute("aria-hidden","true");backdrop.setAttribute("aria-hidden","true");activePointer=null;pointers.clear();dragging=false;moved=false}
["pointerdown","pointerup","click"].forEach(type=>{backdrop.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();if(type==="click")hideCta(e)});close.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();if(type==="click")hideCta(e)});cta.addEventListener(type,e=>e.stopPropagation())});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modalOpen)hideCta(e)});
function capture(x,y){if(captureBusy||blocked()||dragging||pointers.size>1)return;captureBusy=true;ensureAudio();place(x,y);const p=photos[0];p.classList.remove("focus");void p.offsetWidth;p.classList.add("focus");focusbox.className="focusbox hunting";setTimeout(()=>{if(blocked()){captureBusy=false;return}focusbox.className="focusbox searching"},240);setTimeout(()=>{if(blocked()){captureBusy=false;return}focusbox.className="focusbox locked";focusSound();setTimeout(()=>{if(blocked()){captureBusy=false;return}shutterSound();flash.classList.remove("fire");camera.classList.remove("shutter");void flash.offsetWidth;flash.classList.add("fire");camera.classList.add("shutter","freeze");freezeUntil=performance.now()+500;captures++;setTimeout(()=>{camera.classList.remove("freeze");if(captures>=3&&!modalOpen)showCta()},500);setTimeout(()=>{focusbox.className="focusbox";camera.classList.remove("shutter");captureBusy=false},620)},110)},430)}
function updatePointer(x,y){const r=camera.getBoundingClientRect();ptx=clamp(((x-r.left)/r.width-.5)*2,-1,1);pty=clamp(((y-r.top)/r.height-.5)*2,-1,1)}
camera.addEventListener("pointerdown",e=>{if(blocked()||e.target.closest(".cta,.backdrop"))return;ensureAudio();camera.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});activePointer=e.pointerId;startX=lastX=e.clientX;startY=lastY=e.clientY;moved=false;dragging=false;if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);pinchZoom=zoomT;camera.classList.add("pinching")}}, {passive:true});
camera.addEventListener("pointermove",e=>{updatePointer(e.clientX,e.clientY);if(!pointers.has(e.pointerId)||blocked())return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){e.preventDefault();const a=[...pointers.values()],d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);if(pinchStart>0)zoomT=clamp(pinchZoom*d/pinchStart,1,2.45);readout.textContent=zoomT.toFixed(1)+"×";camera.classList.toggle("zoomed",zoomT>1.01);moved=true;return}if(e.pointerId===activePointer){const dist=Math.hypot(e.clientX-startX,e.clientY-startY);if(dist>8){e.preventDefault();moved=true;dragging=true;camera.classList.add("dragging");const mx=72+150*(zoomT-1),my=58+125*(zoomT-1);panTX=clamp(panTX+(e.clientX-lastX),-mx,mx);panTY=clamp(panTY+(e.clientY-lastY),-my,my);lastX=e.clientX;lastY=e.clientY}}},{passive:false});
function endPointer(e){if(!pointers.has(e.pointerId))return;const wasMulti=pointers.size>1;pointers.delete(e.pointerId);camera.classList.remove("dragging");if(pointers.size<2){camera.classList.remove("pinching");pinchStart=0}if(!wasMulti&&!moved&&!blocked())capture(e.clientX,e.clientY);if(pointers.size===0){activePointer=null;dragging=false;moved=false;ptx=pty=0}}
camera.addEventListener("pointerup",endPointer);camera.addEventListener("pointercancel",endPointer);camera.addEventListener("pointerleave",()=>{if(!dragging)ptx=pty=0});
function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;if(reduced){stage.style.transform="translate3d(0,0,0) scale(1.16)";requestAnimationFrame(animate);return}if(now<freezeUntil){requestAnimationFrame(animate);return}px+=(ptx-px)*.055;py+=(pty-py)*.055;zoom+=(zoomT-zoom)*.12;panX+=(panTX-panX)*.14;panY+=(panTY-panY)*.14;const lx=Math.sin(elapsed*.53)*10+Math.sin(elapsed*1.17+1.4)*4,ly=Math.cos(elapsed*.46+.6)*8+Math.sin(elapsed*1.03)*3,lz=Math.sin(elapsed*.46)*.026+Math.sin(elapsed*1.08+.9)*.012,zs=Math.max(0,zoom-1),tx=panX+px*(-22-zs*26)+lx,ty=panY+py*(-16-zs*22)+ly,ts=(1.16+lz)*zoom+Math.abs(px)*.01+Math.abs(py)*.008,tr=px*1.5+Math.sin(elapsed*.42)*.22;cx+=(tx-cx)*.065;cy+=(ty-cy)*.065;cs+=(ts-cs)*.055;cr+=(tr-cr)*.05;stage.style.transform=`translate3d(${cx}px,${cy}px,0) rotateZ(${cr}deg) scale(${cs})`;requestAnimationFrame(animate)}
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
